name: CI

'on':
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check data, XML, JVM tests and release logic
        run: python3 tools/check.py
      - name: Build APK without signing secrets
        run: >-
          python3 tools/build_native.py --bootstrap --unsigned
          --sdk "$RUNNER_TEMP/kanji-sdk" --output build/ci-unsigned.apk
