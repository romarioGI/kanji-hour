name: CI

'on':
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check data, XML, JVM tests and release logic
        run: python3 tools/check.py
      - name: Build unsigned APK and check version override
        env:
          CI_VERSION_CODE: '123456789'
        run: |
          python3 tools/build_native.py --bootstrap --unsigned \
            --sdk "$RUNNER_TEMP/kanji-sdk" --output build/ci-unsigned.apk \
            --version-code "$CI_VERSION_CODE"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          manifest = ET.parse("app/src/main/AndroidManifest.xml").getroot()
          expected = (manifest.attrib["package"], os.environ["CI_VERSION_CODE"],
                      manifest.attrib["{http://schemas.android.com/apk/res/android}versionName"])
          aapt2 = Path(os.environ["RUNNER_TEMP"]) / "kanji-sdk/build-tools/35.0.1/aapt2"
          badging = subprocess.check_output([aapt2, "dump", "badging", "build/ci-unsigned.apk"], text=True)
          package = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          actual = package.groups() if package else None
          if actual != expected:
              raise SystemExit(f"APK package/version mismatch: expected {expected}, got {actual}")
          print(f"APK version override verified: {actual}")
          PY
